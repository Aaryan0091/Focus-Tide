<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Pomodoro focus timer with ambient rain and soft music, a progress ring, and configurable focus and break intervals.">
    <meta name="theme-color" content="#16213e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%85%3C/text%3E%3C/svg%3E">
    <title>Pomodoro Timer with Ambient Sounds</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="focus-mode">
    <!-- Cross-fading background layers (gradients can't be transitioned directly) -->
    <div class="bg-layers" aria-hidden="true">
        <div class="bg-layer bg-focus"></div>
        <div class="bg-layer bg-break"></div>
    </div>

    <!-- Background Animation Container -->
    <div class="bg-animation" id="bgAnimation" aria-hidden="true"></div>

    <main class="timer-card">
        <h1 class="visually-hidden">Pomodoro Timer with Ambient Sounds</h1>

        <!-- Sound controls -->
        <div class="card-top">
            <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Mute ambient sound">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <div class="volume-control">
                <label class="visually-hidden" for="volumeSlider">Volume</label>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" step="1" value="50">
                <span class="volume-label" id="volumeLabel" aria-hidden="true">50%</span>
            </div>
        </div>

        <p class="mode-badge" id="modeBadge">Focus Mode</p>

        <div class="progress-ring">
            <svg viewBox="0 0 280 280" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
                <circle class="progress-ring-bg" cx="140" cy="140" r="135"></circle>
                <circle class="progress-ring-fill" id="progressRing" cx="140" cy="140" r="135"></circle>
            </svg>
            <div class="timer-display-container">
                <p class="timer-display" id="timerDisplay" role="timer" aria-label="Time remaining">25:00</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Start
            </button>
            <button class="btn-secondary" id="resetBtn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                Reset
            </button>
        </div>

        <!-- Time Settings -->
        <div class="time-settings">
            <div class="time-input-group">
                <label for="focusTimeInput">Focus Time</label>
                <div class="time-input">
                    <input type="number" id="focusTimeInput" inputmode="numeric" min="1" max="120" step="1" value="25">
                    <span>min</span>
                </div>
            </div>
            <div class="time-input-group">
                <label for="breakTimeInput">Break Time</label>
                <div class="time-input">
                    <input type="number" id="breakTimeInput" inputmode="numeric" min="1" max="60" step="1" value="5">
                    <span>min</span>
                </div>
            </div>
        </div>

        <!-- Mode Switch Buttons -->
        <div class="mode-switch">
            <button class="btn-secondary" id="focusModeBtn" type="button" aria-pressed="true">
                <span aria-hidden="true">🎧</span> Focus Mode
            </button>
            <button class="btn-secondary" id="breakModeBtn" type="button" aria-pressed="false">
                <span aria-hidden="true">☕</span> Break Mode
            </button>
        </div>

        <p class="session-count">
            Session <span id="sessionCount">1</span> of 4
        </p>

        <p class="hint">Press <kbd>Space</kbd> to start or pause, <kbd>R</kbd> to reset</p>

        <a class="case-study-link" href="/timer.html">Try the new UI</a>
    </main>

    <!-- Screen reader announcements for mode changes and session completion -->
    <div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
