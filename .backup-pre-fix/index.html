<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer with Ambient Sounds</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="focus-mode">
    <!-- Background Animation Container -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Sound Toggle -->
    <button class="sound-toggle" id="soundToggle" title="Toggle Sound">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </button>

    <!-- Volume Control -->
    <div class="volume-control">
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
        <span class="volume-label" id="volumeLabel">50%</span>
    </div>

    <!-- Timer Card -->
    <div class="timer-card">
        <div class="mode-badge" id="modeBadge">Focus Mode</div>

        <div class="progress-ring">
            <svg>
                <circle class="progress-ring-bg" cx="140" cy="140" r="135"></circle>
                <circle class="progress-ring-fill" id="progressRing" cx="140" cy="140" r="135"></circle>
            </svg>
            <div class="timer-display-container">
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Start
            </button>
            <button class="btn-secondary" id="resetBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                Reset
            </button>
        </div>

        <!-- Time Settings -->
        <div class="time-settings">
            <div class="time-input-group">
                <label>Focus Time:</label>
                <div class="time-input">
                    <input type="number" id="focusTimeInput" min="1" max="120" value="25">
                    <span>min</span>
                </div>
            </div>
            <div class="time-input-group">
                <label>Break Time:</label>
                <div class="time-input">
                    <input type="number" id="breakTimeInput" min="1" max="60" value="5">
                    <span>min</span>
                </div>
            </div>
        </div>

        <!-- Mode Switch Buttons -->
        <div class="mode-switch">
            <button class="btn-secondary" id="focusModeBtn">
                🎧 Focus Mode
            </button>
            <button class="btn-secondary" id="breakModeBtn">
                ☕ Break Mode
            </button>
        </div>

        <div class="session-count">
            Session <span id="sessionCount">1</span> of 4
        </div>
    </div>

    <script type="module" src="/script.js"></script>
</body>
</html>
